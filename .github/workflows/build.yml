name: Build Deb Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential checkinstall git make clang libstdc++6 lz4 dpkg

    - name: Setup Theos & SDK
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* $HOME/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Build Tweak (.deb)
      run: |
        make package FINALPACKAGE=1

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DKAutoCombo-deb
        path: packages/*.deb
